name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore LatteShotStencilGenerator.sln
      - name: Test solution
        run: dotnet test LatteShotStencilGenerator.sln --configuration Release --no-restore
      - name: Publish client
        run: dotnet publish src/LatteShotStencilGenerator/LatteShotStencilGenerator.csproj --configuration Release --no-restore --output ${{ runner.temp }}/publish
      - name: Prepare GitHub Pages artifact
        shell: pwsh
        run: ./eng/PrepareGitHubPagesArtifact.ps1 -PublishDirectory '${{ runner.temp }}/publish/wwwroot' -ArtifactDirectory '${{ runner.temp }}/github-pages' -RepositorySubpath LatteShotStencilGenerator
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
